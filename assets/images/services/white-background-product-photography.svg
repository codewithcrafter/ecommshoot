<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg_white-background-product-photography" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <pattern id="pat_white-background-product-photography" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="1.5" fill="rgba(255,255,255,0.1)" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg_white-background-product-photography)" />
  <rect width="800" height="600" fill="url(#pat_white-background-product-photography)" />
  
  <!-- Studio Lighting Ring & Aperture Graphic -->
  <g transform="translate(400, 240)">
    <circle r="140" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="30" />
    <circle r="110" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10 8" opacity="0.8" />
    <circle r="85" fill="rgba(0,0,0,0.25)" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    
    <!-- Camera Lens Blades -->
    <path d="M -40 -30 L 30 -60 L 50 -10 Z" fill="rgba(255,255,255,0.2)" />
    <path d="M 30 -60 L 60 20 L 10 30 Z" fill="rgba(255,255,255,0.15)" />
    <path d="M 60 20 L -10 60 L -30 20 Z" fill="rgba(255,255,255,0.2)" />
    <path d="M -10 60 L -60 -10 L -20 -30 Z" fill="rgba(255,255,255,0.25)" />
    
    <circle r="30" fill="#FFFFFF" opacity="0.9" />
    <circle r="10" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <rect x="100" y="420" width="600" height="130" rx="12" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(255,255,255,0.15)" />
  <text x="400" y="465" fill="#FFFFFF" font-family="Space Grotesk, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">White Background Packshots</text>
  <text x="400" y="505" fill="#FFFFFF" font-family="DM Sans, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle" letter-spacing="1.5">Pure RGB #FFFFFF Amazon Compliant</text>
  <text x="400" y="532" fill="rgba(255,255,255,0.7)" font-family="DM Sans, Arial, sans-serif" font-size="13" text-anchor="middle">ECOMSHOOT STUDIO PRODUCTION</text>
</svg>